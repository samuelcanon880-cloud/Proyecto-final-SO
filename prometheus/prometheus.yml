global:
  scrape_interval: 5s             # cada cuánto lee las métricas (en producción: 15s o más)
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus          # Prometheus se mide a sí mismo
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backends            # Flask, directo a cada backend (NO a través de Nginx)
    static_configs:
      - targets: ["app1:5000", "app2:5000", "app3:5000"]

  - job_name: nginx               # el exporter traduce stub_status a formato Prometheus
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: cadvisor            # métricas de los contenedores
    static_configs:
      - targets: ["cadvisor:8080"]
