networks:
  red-proyecto:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

services:
  app1:
    build: ./backend
    container_name: app1
    environment:
      - SERVER_NAME=Backend-1
    networks:
      - red-proyecto
    restart: always

  app2:
    build: ./backend
    container_name: app2
    environment:
      - SERVER_NAME=Backend-2
    networks:
      - red-proyecto
    restart: always

  app3:
    build: ./backend
    container_name: app3
    environment:
      - SERVER_NAME=Backend-3
    networks:
      - red-proyecto
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"            # el 8088 (stub_status) queda dentro de la red, no se publica
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - red-proyecto
    depends_on:
      - app1
      - app2
      - app3
    restart: always

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx:8088/stub_status"
    networks:
      - red-proyecto
    depends_on:
      - nginx
    restart: always

  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: cadvisor
    command:
      - "--housekeeping_interval=5s"   # refresca cada 5 s (igual que Prometheus)
      - "--docker_only=true"           # solo contenedores Docker, menos ruido
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - red-proyecto
    restart: always

  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - red-proyecto
    restart: always

  grafana:
    image: grafana/grafana:12.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Solo para uso local: entra sin usuario y con rol Admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    networks:
      - red-proyecto
    depends_on:
      - prometheus
    restart: always

  # Prueba de carga: no arranca con "up", se lanza con "docker compose run --rm artillery"
  artillery:
    image: artilleryio/artillery:latest
    profiles: ["pruebas"]
    volumes:
      - ./:/scripts
    command: run --target http://nginx:80 --output /scripts/resultados/reporte.json /scripts/performance-test.yml
    networks:
      - red-proyecto
    depends_on:
      - nginx
