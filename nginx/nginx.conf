upstream backend_cluster {
    zone backend_cluster 64k;   # contador de turnos compartido entre los workers
    # Round Robin por defecto: reparte las solicitudes por turnos
    server app1:5000;
    server app2:5000;
    server app3:5000;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cabecera para ver qué backend respondió
        add_header X-Upstream $upstream_addr always;
    }
}

# Puerto interno de métricas (NO se publica en docker-compose).
# Lo lee nginx-exporter para convertirlo al formato de Prometheus.
server {
    listen 8088;
    access_log off;
    location /stub_status {
        stub_status;
    }
}
